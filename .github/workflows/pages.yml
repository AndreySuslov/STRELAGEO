name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ["poehali/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poehali/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: poehali
      - run: npm run check && npm run build && npm run test:sites
        working-directory: poehali
        env:
          PAGES_BASE_PATH: /STRELAGEO/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: poehali/dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

